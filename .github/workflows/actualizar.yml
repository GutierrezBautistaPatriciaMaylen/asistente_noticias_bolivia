name: actualizar noticias

on:
  schedule:
    - cron: '0 11 * * *'   # todos los días a las 7:00 am de bolivia
  workflow_dispatch:        # permite correrlo a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: librerias del sistema
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libssl-dev

      - name: paquetes de r
        run: Rscript -e 'install.packages(c("tidyverse","rvest","lubridate","jsonlite","httr","igraph","Matrix","SnowballC","robotstxt","gtrendsR"))'

      - name: correr el proyecto
        run: Rscript -e 'actualizar_datos <- TRUE; source("R/main.R")'

      - name: guardar los datos nuevos
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs bitacora datos
          git diff --staged --quiet || (git commit -m "actualizar datos" && git push)
